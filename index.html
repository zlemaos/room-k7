<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Access</title>
<style>body{margin:0;background:#080808;color:#fff;font:18px/1.5 sans-serif}main{max-width:440px;margin:10vh auto;padding:24px}input,button{font:inherit;min-height:48px;padding:8px;box-sizing:border-box;width:100%;margin:12px 0;background:#171717;color:#fff;border:1px solid #999}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080808}p{overflow-wrap:anywhere}</style></head>
<body><main><h1>Access</h1><form><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button>Open</button></form><p id="status" role="status"></p></main><script src="602bf6c2647c95c6a94786bdc62eed6748183c636fe2182a3a8f8f5d666bce2c.js"></script><script>
'use strict';
const unhex=s=>Uint8Array.from(s.match(/../g),x=>parseInt(x,16));
const bytes=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
document.querySelector('form').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.querySelector('button'),status=document.getElementById('status');button.disabled=true;status.textContent='Opening…';
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unhex(PACKET.s),iterations:PACKET.n,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unhex(PACKET.v)},key,unhex(PACKET.d));
  const files=JSON.parse(new TextDecoder().decode(raw)),urls={};
  for(const [name,data] of Object.entries(files)){
   const type=name.endsWith('.mp3')?'audio/mpeg':name.endsWith('.woff2')?'font/woff2':name.endsWith('.js')?'text/javascript':name.endsWith('.css')?'text/css':'text/plain';
   if(!name.endsWith('.html')&&!name.endsWith('.css'))urls[name]=URL.createObjectURL(new Blob([bytes(data)],{type}));
  }
  const text=n=>new TextDecoder().decode(bytes(files[n]));
  let css=text('app.css');for(const [n,url] of Object.entries(urls))css=css.split(n).join(url);
  urls['app.css']=URL.createObjectURL(new Blob([css],{type:'text/css'}));
  let html=text('index.html');
  html=html.replace('<head>','<head><script>window.ASSETS='+JSON.stringify(urls)+';<\/script>');
  html=html.replace(/(src|href)="([^"]+)"/g,(all,attr,n)=>urls[n]?attr+'="'+urls[n]+'"':all);
  const frame=document.createElement('iframe');frame.title='Workspace';frame.srcdoc=html;document.body.append(frame);
  document.getElementById('p').value='';delete globalThis.PACKET;status.textContent='';
 }catch(err){status.textContent='Could not open. Check the password and try again.';}
 finally{button.disabled=false;}
});
</script></body></html>
